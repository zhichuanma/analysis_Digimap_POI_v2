# Paths are relative to the SPEC data root: ~/Work/analysis_Digimap_POI_v2/.
# This configuration does not claim that real inputs have been prepared.
radii_m: [500, 1000]
classification_mode: native
include_ev_charging: false
poi_batch_size: 10000
station_batch_size: 1000
# WGS84 longitude/latitude degrees -> approximate BNG x/y metres, h=0 m.
# Fixed seven-parameter operation, independent of grids and network access.
coordinate_operation: >-
  +proj=pipeline
  +step +proj=unitconvert +xy_in=deg +xy_out=rad
  +step +proj=push +v_3
  +step +proj=cart +ellps=WGS84
  +step +inv +proj=helmert +x=446.448 +y=-125.157 +z=542.06
  +rx=0.1502 +ry=0.247 +rz=0.8421 +s=-20.4894 +convention=position_vector
  +step +inv +proj=cart +ellps=airy
  +step +proj=pop +v_3
  +step +proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717
  +x_0=400000 +y_0=-100000 +ellps=airy
paths:
  raw_dir: data/raw
  source_manifest: data/source_manifest.json
  cities_dir: cities
  geography_dir: data/raw/geography
  output_dir: outputs
