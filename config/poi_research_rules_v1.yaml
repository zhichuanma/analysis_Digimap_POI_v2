functional_groups:
  accommodation: Actual overnight accommodation establishment.
  food_beverage: Food/drink venue or catering workplace.
  retail: Retail trading or shop/customer service premises; not merely the goods or
    ancillary equipment.
  leisure_tourism: Identifiable recreation, cultural, sport or visitor venue.
  office_services: Business, professional or personal-service workplace; public access
    is not required.
  education_health_public: Education, health, government or community-service premises.
  industry_logistics: Identifiable producer, farming, industrial, storage or logistics
    workplace; public access is not required.
  transport_parking: Identifiable parking, fuel or passenger/mobility service premises.
